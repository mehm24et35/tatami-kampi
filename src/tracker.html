<title>Tatami Kampı</title>
<script>/* Tema seçimi (Ayarlar › Görünüm) ilk boyadan önce uygulanır ki açılışta yanıp sönmesin */(function(){try{var t=localStorage.getItem("tk_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})()</script>
<!--__FONTS__-->
<style>
/* Tasarım sistemi: bilgi/tasarim.md › Değerler (tur 2, 2026-10-06). Nötr zemin + tek vurgu (turuncu): yalnız ana eylem, bugün, ilerleme, sayaç dolumu.
   Durum renkleri yalnız durum göstergesinde: --teal dinlenme (mavi), --gold hazırlan (amber), --good tamam (yeşil); efor = vurgu.
   Yazı: Barlow (gövde, başlık) + Barlow Semi Condensed (rakam, reçete, sayaç); 12/14/16/19/28 px, ağırlık 400/600/700. Boşluk 4/8/12/16/24/32. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F4F4F5; --raised2:#E4E4E7; --sheet-sunk:#F4F4F5; --ink:#18181B; --muted:#5F5F66; --line:#ECECEE; --edge:#8A8A93;
  --accent:#E4501B; --on-accent:#FFFFFF;
  --cta:#18181B; --on-cta:#FFFFFF;
  --teal:#1F5BC4; --gold:#9A5B00; --good:#16803C; --on-good:#FFFFFF; --bad:#C0271B;
  --scrim:rgba(0,0,0,.45); --shadow:0 8px 24px rgba(0,0,0,.18);
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-xs:12px; --fs-s:14px; --fs-m:16px; --fs-l:19px; --fs-xl:28px;
  --r:14px; --r-s:10px;
}
/* Koyu: vurgu ve dolgulu durum rengi üstünde koyu metin (--on-accent, --on-good). --edge: tik/seçici/giriş kenarı ≥3:1 (--line yalnız ayırıcı). Alt sayfa zemini --surface (yükseltilmiş); içindeki dolgular --sheet-sunk. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141416; --surface:#1E1F22; --sunk:#1E1F22; --raised2:#2E2F33; --sheet-sunk:#2E2F33; --ink:#F2F2F0; --muted:#A1A1A6; --line:#26272B; --edge:#74747C;
    --accent:#FF6A2B; --on-accent:#141416;
    --cta:#F2F2F0; --on-cta:#141416;
    --teal:#7DA3EA; --gold:#E2A740; --good:#4DBB73; --on-good:#141416; --bad:#FF6B5F;
    --scrim:rgba(0,0,0,.6); --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416; --surface:#1E1F22; --sunk:#1E1F22; --raised2:#2E2F33; --sheet-sunk:#2E2F33; --ink:#F2F2F0; --muted:#A1A1A6; --line:#26272B; --edge:#74747C;
  --accent:#FF6A2B; --on-accent:#141416;
  --cta:#F2F2F0; --on-cta:#141416;
  --teal:#7DA3EA; --gold:#E2A740; --good:#4DBB73; --on-good:#141416; --bad:#FF6B5F;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:var(--fs-m)/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 132px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-top:8px}
h1,h2,h3{font-family:var(--body);font-weight:700;letter-spacing:-.2px;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:var(--fs-xl)} h2,h3{font-size:var(--fs-l)}
.eyebrow{font-size:var(--fs-s);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
b,strong{font-weight:600}
a{color:inherit;text-underline-offset:2px}

/* üst bar: yalnız buluta kaydeden kişisel sürümde (durum göstergesi için) görünür; ekran başlıkları kendi başlığını taşır */
.top{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.top:has(.sync.on,.sync.busy){display:block}
.top .row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;min-height:36px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:var(--fs-l)}
.brand svg{width:22px;height:22px;flex:none}
.sync{margin-left:auto;font-size:var(--fs-s);color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.sync.busy i{background:var(--gold)}

/* gün başlığı: solda tarih + "Bugün" (başka gün seçiliyse gün adı), sağda hafta (‹ Hafta N / 12 ›, altında evre) */
.weeknav{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:14px 0 16px}
.weeknav .dh{min-width:0}
.daytitle{font-size:30px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.wkctl{display:flex;align-items:center;flex:none;margin-right:-12px}
.wkctl .iconbtn{background:none;color:var(--ink)} /* zeminsiz ok, dokunma alanı 44 px; arada hafta etiketi */
.wkctl .iconbtn svg{width:10px;height:18px}
.wkctl h2{font-size:var(--fs-s);font-weight:400;color:var(--muted);text-align:center;line-height:1.25;letter-spacing:0}
.wkctl h2 b{display:block;color:var(--ink);font-weight:600;font-size:var(--fs-m)}
.todaylink{background:none;border:0;padding:13px 0;margin:-13px 0;font-size:var(--fs-s);color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px} /* tarih satırında küçük bağlantı; dokunma alanı 44 px */
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-size:var(--fs-l);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
/* evre: Program'daki zaman çizelgesinde griden mürekkebe koyulaşan ton (renk değil); başlıkta düz yazı */
.ph-H0{background:var(--sunk);color:var(--muted)}
.ph-F1{background:color-mix(in srgb,var(--ink) 12%,var(--bg));color:var(--ink)}
.ph-F2{background:color-mix(in srgb,var(--ink) 32%,var(--bg));color:var(--ink)}
.ph-F3{background:var(--ink);color:var(--bg)}
.ph-T{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
/* hafta şeridi: dikdörtgen karolar. Bugün vurgu dolgu; yapılan gün koyu karo + tik; dinlenme kesikli çerçeve; diğer günler hafif dolgu; seçili (bugün değilse) mürekkep halka.
   7 × ≥44 px + 6 × 8 px 343 px'e sığmaz: şerit sayfa kenarına 8 px taşar; dar telefonda önce aralık daralır, genişlik 44 px kalır. */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:clamp(2px,calc((100% - 308px) / 6),8px);margin:0 -8px 8px}
.days button{border:0;background:var(--sunk);border-radius:8px;height:56px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;color:var(--ink);position:relative}
.days button span{font-size:var(--fs-xs);font-weight:500;color:var(--muted);line-height:1.1}
.days button small{font-family:var(--display);font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.days button svg{width:16px;height:16px}
.days button.done{background:var(--raised2)}
.days button.off{background:none;outline:1px dashed var(--edge);outline-offset:-1px}
.days button.off small{color:var(--muted)}
.days button.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.days button.today{background:var(--accent);color:var(--on-accent);outline:0;box-shadow:none}
.days button.today span{color:var(--on-accent);font-weight:700}
.days button.today small{font-weight:700}
.days button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.days button .dot{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--gold)} /* yarım gün */
.days button.today .dot{background:var(--on-accent)}

/* seans: başlık karışık harf, altında süre satırı, tek ana düğme (vurgu) */
.sess-head{margin:20px 0 14px}
.sess-head h1{font-size:var(--fs-xl);letter-spacing:-.3px;line-height:1.1}
.sess-meta{color:var(--muted);font-size:var(--fs-m);margin-top:4px}
.sess-meta b{color:var(--ink);font-weight:600}
.sess-rir{color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.pauseline{margin:0 0 16px}
.bar{height:4px;background:var(--raised2);border-radius:2px;overflow:hidden;margin:-4px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.banner{background:var(--sunk);color:var(--ink);border-radius:var(--r);padding:12px;font-size:var(--fs-s);margin-bottom:12px}
.banner b{font-weight:600}
.alt{font-size:var(--fs-s);color:var(--muted);margin:0 0 16px}
.alt b{color:var(--ink);font-weight:600}
.weekinfo{font-size:var(--fs-s);color:var(--muted);margin:0}
.weekinfo b{color:var(--ink);font-weight:600}

/* bloklar: kart değil, başlıklı düz liste */
.block{margin:0 0 16px}
.block>h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);min-height:28px;padding-top:6px}
/* katlı ısınma / soğuma: tek satır (ad + "İp atlama, bilek ve 4 hareket daha"), sağda durum ve ok; açınca hareket satırları */
details.wu{border-bottom:1px solid var(--line);margin:0 0 8px}
details.wu>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;cursor:pointer}
details.wu>summary::-webkit-details-marker{display:none}
details.wu>summary>span{flex:1;min-width:0;display:flex;flex-direction:column}
details.wu>summary b{font-size:var(--fs-m)}
details.wu>summary small,details.wu>summary em{font-size:var(--fs-s);color:var(--muted);font-style:normal}
details.wu.done>summary em{color:var(--good);font-weight:600}
details.wu.done>summary b{color:var(--muted)}
details.wu>summary i{flex:none;width:8px;height:8px;margin:0 4px 4px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details.wu[open]>summary i{transform:rotate(-135deg);margin-bottom:-4px}
.wu-all{display:flex;justify-content:flex-end;padding:8px 0} /* "Hepsi ✓" özet satırından ve ilk hareket satırından ≥8 px uzak */
.block>h3 .btn{margin-block:3px} /* başlıktaki düğme (Hepsi ✓, + Ekle) ilk satırın düğmesinden ≥8 px uzak; başlık yalnız düğme varsa uzar */
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.i-top{display:flex;align-items:flex-start;gap:12px}
.i-main{flex:1;min-width:0}
.i-name{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:var(--fs-m);line-height:1.3;color:var(--ink)}
.i-name::after{content:" ›";color:var(--muted);font-weight:400}
.i-en{display:block;font-size:var(--fs-s);color:var(--muted);margin:2px 0 0}
.pl-list li .nm .en,.homecard li .en{display:block;font-size:var(--fs-s);color:var(--muted);font-weight:400}
.i-rx{font-family:var(--display);font-weight:600;font-size:var(--fs-l);color:var(--ink);font-variant-numeric:tabular-nums}
.i-rest{background:none;border:0;padding:0;font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.hint{font-size:var(--fs-s);color:var(--ink);margin:4px 0 0;font-weight:600}
.i-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.i-note{font-size:var(--fs-s);color:var(--muted);margin:4px 0 0}
.i-prev{font-size:var(--fs-s);color:var(--muted);margin:4px 0 0}
/* hareket satırı: kapalıyken tek satır (ad, İngilizce ad, reçete · dinlenme, durum); dokununca setler açılır */
.item.acc{padding:0}
.i-head{display:flex;align-items:center;gap:8px}
.i-row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;background:none;border:0;padding:10px 0;text-align:left;color:var(--ink)}
.i-row .i-main{display:block}
.i-nm{display:block;font-weight:600;font-size:var(--fs-m);line-height:1.3}
.i-row .i-en{font-size:13px}
.i-st{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.i-st>b{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);max-width:42vw;text-wrap:balance} /* reçete satırın sağında (3×12); altında durum (1/3, ✓) */
.i-st.part>small{color:var(--ink);font-weight:600}
.i-st.done>small{color:var(--good);font-weight:600}
.i-st small{font-size:13px}
.item.done:not(.open) .i-nm,.item.done:not(.open) .i-st>b{color:var(--muted)}
.i-body{padding:0 0 16px}
.donechip{display:block;color:var(--good);font-size:var(--fs-s);font-weight:600;margin:0 0 8px}
.hist{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.hist td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.hist td:first-child{color:var(--muted);width:78px}
.backlink{background:none;border:0;padding:12px 6px;color:var(--ink);font-weight:600;font-size:var(--fs-s);margin:-1px -6px 0;text-decoration:underline;text-underline-offset:3px}
.res thead th small{display:block;font-family:var(--body);font-weight:400;font-size:var(--fs-s)}

/* setler */
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--bg);display:grid;place-items:center;font-size:var(--fs-m);color:var(--muted)}
.tick.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.setrow{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.setrow.one{grid-template-columns:20px minmax(0,1fr) 44px}
.setrow.sw{grid-template-columns:20px minmax(0,1fr) 44px 44px}
.setrow .n{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center}
.swbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.swbtn.run{background:var(--teal);color:var(--bg)}
.swbtn svg{width:15px;height:15px}
.field{position:relative;min-width:0}
.field input{width:100%;min-width:0;height:44px;border:1px solid var(--edge);border-radius:var(--r-s);background:transparent;padding:0 34px 0 12px;font-variant-numeric:tabular-nums;font-size:var(--fs-m)}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:var(--fs-s);color:var(--muted);pointer-events:none}
.bubbles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bubble{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--bg);font-family:var(--display);font-weight:600;color:var(--muted)}
.bubble.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.testcta{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:var(--r);padding:4px 4px 4px 12px;margin:8px 0}
.testcta p{margin:0;font-size:var(--fs-s)}

/* butonlar: birincil mürekkep, ikincil gri dolgu; kenar çizgisi yok */
.btn{border:0;border-radius:var(--r-s);background:var(--cta);color:var(--on-cta);padding:8px 16px;min-width:44px;min-height:44px;font-weight:600;font-size:var(--fs-m);white-space:nowrap}
a.btn,label.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.acc{background:var(--cta);color:var(--on-cta)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:var(--fs-s)}

/* bilgi şeridi: tek satır metin + tek eylem + kapat; metne dokununca ayrıntı açılır */
.strip{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:var(--r);padding:4px 4px 4px 12px;margin:0 0 8px}
.strip-t{flex:1;min-width:0;min-height:44px;background:none;border:0;padding:0;text-align:left;font-size:var(--fs-s);line-height:1.35;color:var(--ink)}
.strip-t b{font-weight:600}
.strip .btn{flex:none;background:var(--bg);color:var(--ink)}
.strip .x{flex:none;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:var(--fs-l)}
.strip.warn{box-shadow:inset 3px 0 0 var(--bad)} /* uyarı: renk zemini değil, sol kenarda ince kırmızı çizgi */
.strips-more{display:block;width:100%;min-height:44px;margin:-4px 0 8px;background:none;border:0;padding:0 12px;text-align:left;font-size:var(--fs-s);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.strip-sheet ul{padding-left:20px}

.homecard{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:0 0 16px}
.homecard summary{list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;min-height:48px}
.homecard summary::-webkit-details-marker{display:none}
.homecard summary h3{font-family:var(--body);font-size:var(--fs-m);font-weight:600}
.homecard ul{list-style:none;margin:8px 0 0;padding:0}
.homecard li{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:var(--fs-s)}
.homecard li button{background:none;border:0;padding:0;text-align:left;font-weight:600}
.homecard li span{color:var(--muted);text-align:right}

.rpe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0}
.rpe button{height:48px;border-radius:var(--r-s);border:0;background:var(--sunk);font-family:var(--display);font-weight:600;font-size:var(--fs-m)}
.rpe button.on{background:var(--cta);color:var(--on-cta)}
textarea{width:100%;min-height:72px;border:1px solid var(--edge);border-radius:var(--r-s);background:transparent;padding:8px 12px;font-size:var(--fs-m);resize:vertical}
.offcard{padding:32px 0 24px;text-align:center;border-bottom:1px solid var(--line)}
.offcard h1{font-size:var(--fs-xl);color:var(--muted)}

/* genel bölüm: kutu değil, üstte ince çizgi */
.card{padding:16px 0 8px;border-top:1px solid var(--line)}
.section-title+.card{border-top:0;padding-top:4px}
.stack{display:flex;flex-direction:column;gap:0}
.section-title{font-size:var(--fs-l);margin:32px 0 8px}
h1.section-title{font-size:var(--fs-xl);margin:16px 0 8px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-s)}
.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px} /* dolgulu kutular sayfa kenarına taşmasın: 7 × 44 + 6 × 8 ancak 388 px'ten geniş ekranda sığar */
@media (min-width:388px){.timeline{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (min-width:760px){.timeline{grid-template-columns:repeat(13,minmax(0,1fr))}}
.timeline button{border:0;border-radius:8px;min-height:44px;font-family:var(--display);font-weight:600;font-size:var(--fs-m);min-width:0}
.timeline button.cur{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:var(--fs-s);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px var(--line)}
.legend i.ph-T{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wk{width:100%;border-collapse:collapse;font-size:var(--fs-m)}
.wk td{padding:13px 4px;border-top:1px solid var(--line);vertical-align:top}
.wk td:first-child{font-size:var(--fs-s);font-weight:600;width:48px;color:var(--muted);padding-left:0}
.wk td:last-child{color:var(--muted);text-align:right;white-space:nowrap;font-size:var(--fs-s);padding-right:0}
.wk button{background:none;border:0;padding:0;text-align:left;font-weight:600}
details.more{border-block:1px solid var(--line);margin:16px 0 0}
details.more>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-weight:600}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary small{font-weight:400;color:var(--muted);font-size:var(--fs-s);margin-left:4px}
details.more>summary i{font-style:normal;color:var(--muted);transition:transform .2s}
details.more[open]>summary i{transform:rotate(180deg)}
details.more>.card{padding-bottom:16px}
.rules{margin:0;padding:0;list-style:none}
.rules li{padding:12px 0;border-top:1px solid var(--line);font-size:var(--fs-s)}
.rules li b{display:block;font-family:var(--display);font-weight:600;font-size:var(--fs-m)}
.kv{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.kv th{text-align:left;font-weight:600;padding:8px 12px 8px 0;border-top:1px solid var(--line);vertical-align:top;width:34%}
.kv td{padding:8px 0;border-top:1px solid var(--line)}

/* hareket kütüphanesi */
.search{width:100%;height:44px;border:1px solid var(--edge);border-radius:var(--r-s);background:transparent;padding:0 12px;font-size:var(--fs-m)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
/* seçenek (tek seçim) ve çip (çok seçim): --sunk dolgu, seçili mürekkep dolgu; sihirbaz (.wz-opt/.wz-chip) ve Alternatif sayfası aynı dili kullanır */
.opt,.wz-opt{border:0;background:var(--sunk);border-radius:var(--r-s);padding:12px;min-height:48px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;color:var(--ink);font:inherit}
.opt b,.wz-opt b{font-weight:600;font-size:var(--fs-m)}.opt small,.wz-opt small{color:var(--muted);font-size:var(--fs-s);line-height:1.35}
.opt.on,.wz-opt.on{background:var(--cta);color:var(--on-cta)}.opt.on small,.wz-opt.on small{color:var(--on-cta);opacity:.75}
.chip,.wz-chip,.chips button{flex:none;border:0;background:var(--sunk);border-radius:var(--r-s);min-height:44px;padding:8px 12px;font-size:var(--fs-s);color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.chip.on,.wz-chip.on,.chips button.on{background:var(--cta);color:var(--on-cta)}
.chip:disabled,.wz-chip:disabled{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);cursor:default} /* seçilemeyen seçenek: dolgusuz, ince çerçeve, gri yazı (sebebi hemen altında yazar) */
/* hareket kütüphanesi: katlanır kategori (ad + sayı), satırlar Gün'deki hareket satırıyla aynı (ad 16/600, altında İngilizce ad) */
.libg{border-top:1px solid var(--line)}
.libg:last-of-type{border-bottom:1px solid var(--line)}
.libg>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;cursor:pointer;font-weight:600}
.libg>summary::-webkit-details-marker{display:none}
.libg>summary small{font-weight:400;color:var(--muted);font-size:var(--fs-s);font-variant-numeric:tabular-nums}
.libg>summary small::after{content:"▾";display:inline-block;margin-left:8px;font-size:var(--fs-m);transition:transform .2s}
.libg[open]>summary small::after{transform:rotate(180deg)}
.libg .lib{padding-bottom:8px}
.sublbl{font-size:var(--fs-s);color:var(--muted);margin:8px 0 0}
.lib{list-style:none;margin:0;padding:0}
.lib li button{width:100%;min-height:56px;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--ink)}
.lib li:first-child button{border-top:0}
.lib li button>span{flex:1;min-width:0}
.lib li b{display:block;font-weight:600;font-size:var(--fs-m);line-height:1.3}
.lib li small{display:block;color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.lib li button::after{content:"›";color:var(--muted);flex:none}
.catlbl{font-weight:600;font-size:13px;letter-spacing:0;color:var(--muted);margin:24px 0 2px}
/* ayar listesi: sol etiket (+ alt açıklama), sağda değer / giriş / tek eylem; tehlikeli işlemler ayrı bölümde, kırmızı yalnız orada */
.slist{margin:0 0 24px}
.slist>.catlbl{margin-top:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;border-radius:0}
.srow>span{flex:1;min-width:0}
.srow>span small{display:block;color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.srow>b{flex:none;font-weight:400;color:var(--muted);font-size:var(--fs-s);text-align:right;font-variant-numeric:tabular-nums}
.srow>i{flex:none;font-style:normal;color:var(--muted);font-size:20px;line-height:1}
.srow>.inp,.srow>select{width:auto;max-width:170px;flex:none}
.srow>.seg{margin:0;flex:none;width:200px}
.srow>.btn{flex:none}
.slist.bad .srow{color:var(--bad)}
.srow.danger,.slist.bad .srow.danger{background:var(--bad);color:var(--bg);border-radius:var(--r-s);padding-inline:12px;font-weight:600} /* iki adımlı silmenin onay hâli: kırmızı dolgu, zemin renginde yazı (açık 5,9:1, koyu 6,7:1) */
.srow.danger small,.srow.danger>b,.srow.danger>i{color:inherit}
.btn.danger{background:var(--bad);color:var(--bg)} /* alt sayfadaki onay düğmesi; .srow.danger ile aynı */
.slist>.btn{margin:8px 0}
.srows{border-top:1px solid var(--line)}
.snote{font-size:var(--fs-s);color:var(--muted);margin:8px 0 0}

/* hareket detayı */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{--sunk:var(--sheet-sunk);overscroll-behavior:contain;background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:var(--fs-xl)}
.sheet .en{color:var(--muted);font-size:var(--fs-s);margin:4px 0 12px}
.sheet h4{font-weight:600;font-size:var(--fs-s);color:var(--muted);margin:16px 0 4px}
.sheet ol,.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:4px 0}
/* alt sayfadaki seçim listesi (Alternatif, Hareketi değiştir, Program dışı arama): seçmek programı/kaydı değiştirir; satırlar arası 9 px, çizgi ortada */
.sheet .lib{padding-left:0}
.sheet .lib li{margin:0}
.sheet .lib li+li{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.sheet .lib li button{border-top:0}
.sheet .left{background:var(--sunk);border-radius:var(--r-s);padding:12px;margin-top:12px;font-size:var(--fs-s)}
.sheet .left b{color:var(--ink)}
.sheet .x{float:right;margin:-4px -4px 0 8px}

/* ölçümler */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lbl{display:block;font-size:var(--fs-s);color:var(--muted);margin-bottom:4px}
.inp{width:100%;min-width:0;height:44px;border:1px solid var(--edge);border-radius:var(--r-s);background:transparent;padding:0 12px;font-size:var(--fs-m);font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow .tn{font-size:var(--fs-m);font-weight:600}
.trow .tn small{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-s)}
.trow details{grid-column:1/-1;font-size:var(--fs-s);color:var(--muted);margin-top:-12px}
.trow summary{cursor:pointer;color:var(--ink);font-size:var(--fs-s);text-decoration:underline;text-underline-offset:3px;width:fit-content;min-width:44px;padding:13px 0} /* "Nasıl?": görünüm aynı küçük bağlantı, dokunma alanı 44 px (alt boşluğu kapalıyken satır dolgusuna taşar) */
.trow details:not([open])>summary{margin-bottom:-8px}
.calcv{font-family:var(--display);font-weight:600;font-size:var(--fs-l);text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-inline:-2px}
.res{border-collapse:collapse;font-size:var(--fs-s);min-width:100%}
.res th,.res td{padding:8px;border-top:1px solid var(--line);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.res th:first-child,.res td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);white-space:normal;min-width:130px}
.res thead th{font-weight:600;color:var(--muted);border-top:0}
.res .grp td{font-weight:600;font-size:var(--fs-s);color:var(--muted);padding-top:16px}
.up{color:var(--good)} .down{color:var(--bad)}
.zones{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.zones td{padding:8px 4px;border-top:1px solid var(--line)}
.zones td:last-child{text-align:right;font-family:var(--display);font-weight:600;font-size:var(--fs-m);font-variant-numeric:tabular-nums}
.zones tr.z2 td{color:var(--ink);font-weight:600}
.chart{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--sunk);border-radius:var(--r);padding:4px;gap:8px;margin:12px 0}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 2px;min-height:44px;font-size:var(--fs-s);color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--edge)}
/* ikincil sekme şeridi (Profil › Testler, Kilo ve nabız): altı çizili metin sekmeleri, sığmazsa yana kayar */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:4px 0 16px}
.tabs button{flex:none;border:0;background:none;padding:0 8px;min-width:44px;min-height:44px;font-size:var(--fs-s);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
/* Profil (tur 2, yapı): başlık, haftalık antrenman kutusu; satırlar .slist/.srow. Görünüm kararı tatami-tasarim'de. */
.prof-head{display:flex;align-items:center;gap:14px;margin:14px 0 18px}
.prof-ini{width:52px;height:52px;border-radius:50%;background:var(--raised2);color:var(--ink);display:grid;place-items:center;flex:none}
.prof-ini svg{width:26px;height:26px}
.prof-name{font-size:24px;letter-spacing:-.3px;margin:0;line-height:1.15}
.prof-sub{margin:1px 0 0;color:var(--muted);font-size:var(--fs-s)}
/* haftalık antrenman: ekrandaki tek kutu (dolgu --sunk, köşe 16); büyük rakam + çubuklar (geçmiş metin rengi, bu hafta vurgu, gelecek kesikli, test haftası altında nokta) */
.prof-week{background:var(--sunk);border-radius:16px;padding:16px;margin:0 0 18px}
.prof-wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.prof-wk-top small{font-weight:400;color:var(--muted);font-size:var(--fs-s)}
.prof-wk-num{display:flex;align-items:baseline;gap:8px;margin:14px 0}
.prof-wk-num b{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.prof-wk-num span{color:var(--muted);font-size:15px}
.prof-bars{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;align-items:end;height:64px}
.prof-bars i{position:relative;display:flex;align-items:flex-end;height:100%}
.prof-bars i b{display:block;width:100%;min-height:3px;border-radius:3px;background:var(--ink)} /* yapılan oran; hiç yapılmadıysa 3 px iz */
.prof-bars i.cur b{background:var(--accent)}
.prof-bars i.fut{border:1px dashed var(--raised2);border-radius:3px} /* gelecek hafta: kesikli çerçeve */
.prof-bars i.test::after{content:"";position:absolute;left:50%;bottom:-9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted)} /* test haftası: çubuğun altında nokta */
.prof-leg{display:flex;align-items:center;gap:6px;margin:16px 0 0;font-size:13px;color:var(--muted)}
.prof-leg i{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.prof-list{margin:0 0 24px}
.prof-list .srow>span{font-weight:600}
.prof-list .srow>span small{font-weight:400}
.prof-back{min-height:44px} /* alt sayfa geri bağlantısı (‹ Profil, ‹ Antrenmana dön): dokunma alanı ≥44 px */

/* sayaç sekmesi */
.tmr{text-align:center;padding:12px 0}
.tmr .phase{font-family:var(--display);font-weight:600;font-size:var(--fs-l)}
.tmr .big{font-family:var(--display);font-weight:700;font-size:min(30vw,168px);line-height:1;font-variant-numeric:tabular-nums}
.tmr .rnd{color:var(--muted);font-size:var(--fs-m)}
.tmr.work .phase,.tmr.work .big{color:var(--accent)}
.tmr.rest .phase,.tmr.rest .big{color:var(--teal)}
.tmr.prep .phase,.tmr.prep .big{color:var(--gold)}
.tbtns{display:flex;gap:12px;justify-content:center;margin:16px 0}
.tbtns .btn{padding:12px 24px;font-size:var(--fs-m)}
/* hazır ayarlar: liste satırı (ad solda, düzen sağda); seçili satırın adı mürekkep, başında nokta */
.presets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.presets button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;text-align:left;color:var(--muted);border-radius:0}
.presets button b{font-weight:400;font-size:var(--fs-m)}
.presets button small{color:var(--muted);font-size:var(--fs-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.presets button.on{color:var(--ink)}
.presets button.on b{font-weight:600}
.presets button.on b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:10px;vertical-align:2px}

/* dinlenme çubuğu + alt menü */
.restbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none}
.restbar .in{pointer-events:auto;width:100%;max-width:720px;background:var(--cta);color:var(--on-cta);border-radius:var(--r);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.restbar .t{font-family:var(--display);font-weight:600;font-size:var(--fs-xl);font-variant-numeric:tabular-nums;line-height:1}
.restbar .l{flex:1;min-width:0;font-size:var(--fs-s);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.restbar button{border:1px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;color:inherit;border-radius:8px;padding:6px 8px;min-width:44px;min-height:44px;font-size:var(--fs-s)}
.restbar.done .in{background:var(--good);color:var(--on-good)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:720px;margin:0 auto}
.nav button{position:relative;border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:var(--fs-xs);font-weight:500}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink);font-weight:700} /* etkin sekme: metin rengi + kalın; çizgi/renk yok */
.nav button.live::after{content:"";position:absolute;top:11px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--cta);color:var(--on-cta);padding:8px 16px;border-radius:var(--r-s);font-size:var(--fs-s);z-index:95;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.act{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;width:max-content}
.toast button{min-height:44px;border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:0 12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} /* yalnız ekran okuyucuya: sayaç faz anonsu */

/* antrenman modu (adım adım): büyük = hareket, hedef, kilo/tekrar, sayaç; ikincil bilgi 13 px gri */
.startcta{width:100%;height:58px;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:var(--fs-l);margin:0 0 16px;display:flex;align-items:center;justify-content:center;gap:10px} /* Bugün'ün tek ana düğmesi: vurgu dolgu (beyaz/koyu yazı 19/700 büyük metin: açık 3,8:1, koyu 6,4:1) */
.startcta svg{width:15px;height:17px}
.player{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* üst: × (yuvarlak), blok adı + adım/set, sağda geçen süre; altında adım şeridi (yapılan metin rengi, şimdiki vurgu, kalan --raised2) */
.pl-top{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.pl-top .t{flex:1;min-width:0;line-height:1.3}
.pl-top .t div{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top .t b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pl-top .el{font-family:var(--display);font-weight:600;font-size:var(--fs-l);color:var(--muted);font-variant-numeric:tabular-nums}
.pl-top .iconbtn svg{width:15px;height:15px}
.pl-prog{display:flex;gap:3px;padding:12px 16px 0}
.pl-prog i{flex:1;height:4px;border-radius:2px;background:var(--raised2)}
.pl-prog i.on{background:var(--ink)}
.pl-prog i.cur{background:var(--accent)}
.pl-body{flex:1;overflow-y:auto;padding:24px 16px 32px;overscroll-behavior:contain} /* son satır sabit düğme alanının 32 px üstünde biter */
.pl-in{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* orta blok (set göstergesi, hedef, sayaç, sayı girişleri) kalan boşlukta dikeyde ortalanır: üstte hareket bilgisi, altta sabit düğme */
.pl-in>:is(.pl-setlbl,.pl-goal,.pl-timer,.steppers):not(:is(.pl-setlbl,.pl-goal,.pl-timer,.steppers)~*){margin-top:auto}
.pl-in>:last-child{margin-bottom:auto}
.pl-goal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pl-goal b{font-family:var(--display);font-weight:700;font-size:min(96px,26vw,13vh);line-height:.95;letter-spacing:-1px}
.pl-goal span{font-size:var(--fs-m);color:var(--muted)}
.pl-name{font-family:var(--body);font-weight:700;font-size:34px;letter-spacing:-.4px;line-height:1.05;background:none;border:0;padding:0;text-align:left;color:var(--ink);text-wrap:balance}
.pl-meta{font-size:15px;color:var(--muted);margin-top:-8px} /* İngilizce ad · reçete · dinlenme tek satır */
.pl-meta b{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.pl-rx{font-family:var(--display);font-weight:600;font-size:var(--fs-l);font-variant-numeric:tabular-nums}
/* set göstergesi: "Set 1 / 3" + çubuklar (yapılan metin rengi, şimdiki vurgu, kalan --raised2) */
.pl-setlbl{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-weight:600;font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.pl-dots{display:inline-flex;gap:8px;margin-left:4px}
.pl-dots i{width:26px;height:6px;border-radius:3px;background:var(--raised2)}
.pl-dots i.on{background:var(--ink)}
.pl-dots i.cur{background:var(--accent)}

// Kalıcı silme iki adımlı (bilgi/arayuz-kurallari.md): 1. dokunuş 5 sn kırmızı onay (geri sayımlı), 2. dokunuş siler; süre dolunca eski hâline döner ("Tüm verileri sil" kalıbı)
function twoStep(el, label, sub, run) {
  if (el.dataset.arm) { clearInterval(+el.dataset.arm); delete el.dataset.arm; return run(); }
  const html = el.innerHTML; let n = 5;
  const tick = () => { if (n > 0) { el.innerHTML = "<span>" + esc(label) + " · " + n-- + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</span>"; return; } clearInterval(iv); delete el.dataset.arm; el.classList.remove("danger"); el.innerHTML = html; };
  const iv = setInterval(tick, 1000); el.dataset.arm = iv; el.classList.add("danger"); tick();
}
function pruneOld(el) { // 6 aydan eski antrenman günlerini siler (testler ve tartımlar kalır)
  const cut = iso(addDays(new Date(), -180)), old = Object.keys(state.logs).filter((d) => d < cut).sort();
  if (!old.length) { toast("6 aydan eski kayıt yok."); return; }
  twoStep(el, "Evet, " + old.length + " günü sil", el.classList.contains("srow") ? fmtDate(parseISO(old[0])) + " – " + fmtDate(parseISO(old[old.length - 1])) + " · yedeğin yoksa önce yedek al" : "", () => {
    old.forEach((d) => { delete state.logs[d]; Store.lq.add("logs/" + d); });
    if (Store.flushLocal()) toast(old.length + " eski gün silindi."); closeSheet(); rerender();
  });
}

function applyTheme(v) {
  if (v !== undefined) { try { if (v) localStorage.setItem("tk_theme", v); else localStorage.removeItem("tk_theme"); } catch (e) {} }
  const t = themeNow(), root = document.documentElement;

// ---------------- logs ----------------
function logDoc(dateStr, create) {
  let L = state.logs[dateStr];
  if (!L && create) { const c = ctx(dateStr); L = state.logs[dateStr] = { date: dateStr, week: c.week, day: c.dayKey, items: {}, rpe: null, note: "", home: false }; }
  return L;
}
function itemLog(dateStr, k, x, create) {
  const L = logDoc(dateStr, create); if (!L) return null;
  if (!x) { const f = itemsOf(ctx(dateStr).sess).find((o) => o.k === k); x = f && f.it.x; }
  const cur = L.items[k];
  if (cur && x && cur.x && cur.x !== x) {
    // Program değişmiş: eski kayıt geçmişte kalsın (grafikler için), bu yeni hareket sayılmasın
    if (!create) return null;
    let key = k + "~" + cur.x; for (let n = 2; L.items[key]; n++) key = k + "~" + cur.x + "~" + n; // A→B→A: önceki kayıt ezilmez
    L.items[key] = cur; delete L.items[k];
  }
  if (!L.items[k] && create) L.items[k] = { x, sets: [] };
  return L.items[k];
}
function prevPerf(dateStr, x) {
  const dates = Object.keys(state.logs).filter((d) => d < dateStr).sort().reverse();
  for (const d of dates) {
    const L = state.logs[d]; if (!L || !L.items) continue;
    for (const k in L.items) {
      const it = L.items[k]; if (!it || it.x !== x) continue;
      const sets = (it.sets || []).filter((s) => s && (s.kg || s.v));
      if (sets.length) return { d, sets };
    }
  }
  return null;
}
function prevText(p, t) {
  if (!p) return "";
  const parts = p.sets.map((s) => t === "w" ? (s.kg ? s.kg + "×" + (s.v || "?") : (s.v || "")) : (s.v || "") + (t === "s" ? " sn" : ""));
  return "Önceki (" + fmtDate(parseISO(p.d)) + "): " + parts.join(" · ");
}

// Kilo önerilen/önceki kilonun 2,5 katından fazla ya da 400 kg üstü, tekrar 100'ün üstü: soru metni, değilse "".
function oddEntry(it, rx, f, val, ref) {
  const n = num(val), tg = target(rx); if (n == null) return "";
  if (f === "kg") return n > 400 || (ref > 0 && n > ref * 2.5) ? showVal({}, n) + " kg mı?" : "";
  return it.t !== "s" && !(tg && tg.u === "m") && n > 100 ? showVal({}, n) + " tekrar mı?" : "";
}
// Sayı olmayan ya da negatif giriş: kaydedilmez, yalnız "Düzelt" (boş = temizle, serbest)
function badEntry(val) { const s = String(val == null ? "" : val).trim(); if (s === "") return ""; const n = num(s); return n == null ? "“" + s.slice(0, 12) + "” sayı değil." : n < 0 ? "Eksi değer olmaz." : ""; }
// Antrenman modu set taslağı ({kg, v}) için aynı kural: ilk bozuk alan ve metni ya da null
function draftBad(it, D) { for (const f of it.t === "w" ? ["kg", "v"] : ["v"]) { const q = badEntry(D[f]); if (q) return [f, q]; } return null; }
// Kilo kontrolünün dayanağı: önerilen kilo, yoksa geçen seferin en ağırı, yoksa bugünün önceki setleri
function kgRef(it, date, sets, i) {
  const sg = kgAdvice(it, date, P.rx(it, ctx(date).ph.wi)); if (sg) return sg.kg;
  const top = (a) => Math.max(0, ...(a || []).map((s) => num(s && s.kg) || 0)), p = prevPerf(date, it.x);
  return (p && top(p.sets)) || top((sets || []).slice(0, i));
}

const TEST_LIM = { tekrar: [0, 150, "tekrar mı"], sn: [0, 900, "sn mi"], kg: [0, 400, "kg mı"], cm: [0, 400, "cm mi"], "dk:sn": [3, 60, "mı"], "atım/dk": [30, 230, "atım mı"], m: [50, 1500, "m mi"] };

const TEST_LIM_ID = { barfiks: [0, 60], kilo: [30, 250], egilme: [-60, 60], apley_s: [-60, 60], apley_l: [-60, 60] };

function testBad(id, raw) {
  const s = String(raw == null ? "" : raw).trim(), t = P.TESTS.find((x) => x.id === id); if (!s || !t || t.calc) return "";

function oddTest(id, raw) {

  const t = P.TESTS.find((x) => x.id === id), L = t && !t.calc && TEST_LIM[t.u], n = L ? (t.time ? parseTime(raw) : num(raw)) : null;
  if (n == null) return "";

function testCheck(inp, d, done) {

  if (!q || (!bad && inp.dataset.okv === val)) { Ask.hide(inp); testSave(d, id, val); return true; }

const PRESETS = [
  { id: "torba", n: "Torba raundu", w: 180, r: 60, k: 6 },
  { id: "torba2", n: "Kısa raunt", w: 120, r: 60, k: 5 },
  { id: "ip30", n: "İp 30/30", w: 30, r: 30, k: 10 },
  { id: "ip40", n: "İp 40/20", w: 40, r: 20, k: 10 },
  { id: "yagmur", n: "Yumruk yağmuru", w: 15, r: 45, k: 10 },
  { id: "tabata", n: "Tabata", d: "20 sn çalış, 10 sn dinlen × 8", w: 20, r: 10, k: 8 },
  { id: "emom", n: "EMOM", d: "Her dakika başı belli tekrar, kalanında dinlen × 12", w: 60, r: 0, k: 12 },
  { id: "ozel", n: "Özel", w: 60, r: 30, k: 5 },
];
const T = { p: Object.assign({}, PRESETS[0]), run: false, phase: "idle", round: 0, end: 0, left: 0, iv: null, lastSec: null };
function tStart() {
  if (T.phase === "idle" || T.phase === "done") { T.round = 1; T.phase = "prep"; T.left = 10; }
  T.lastSec = null;
  T.end = Date.now() + T.left * 1000; T.run = true; clearInterval(T.iv); T.iv = setInterval(tTick, 200); keepAwake(true); beep(880, 0.05); tPaint(); renderNav();
}
function tPause() { T.left = Math.max(0, (T.end - Date.now()) / 1000); T.run = false; clearInterval(T.iv); keepAwake(false); tPaint(); renderNav(); }
function tReset() { clearInterval(T.iv); T.run = false; T.phase = "idle"; T.round = 0; T.left = 0; T.lastSec = null; keepAwake(false); tPaint(); renderNav(); }
// Faz bitişi önceki fazın bitiş anından sayılır (Date.now değil): arka planda uzun kalınca fazlar kaymaz, tTick kaçanları peş peşe geçer
function tNext() {
  if (T.phase === "prep") { T.phase = "work"; T.left = T.p.w; }
  else if (T.phase === "work") {
    if (T.round >= T.p.k) { T.phase = "done"; T.run = false; clearInterval(T.iv); keepAwake(false); beep(990, 0.9, 0.12); buzz([300, 100, 300, 100, 300]); tPaint(); renderNav(); return; }
    if (T.p.r > 0) { T.phase = "rest"; T.left = T.p.r; } else { T.round++; T.left = T.p.w; }
  } else if (T.phase === "rest") { T.round++; T.phase = "work"; T.left = T.p.w; }
  T.end += T.left * 1000;
}
function tTick() {
  let n = 0;
  while (T.run && T.end - Date.now() <= 0 && n++ < 1000) { T.lastSec = null; tNext(); }
  if (n && T.run) { beep(T.phase === "work" ? 990 : 520, 0.5, 0.12); buzz(250); }
  const left = (T.end - Date.now()) / 1000;
  const sec = Math.ceil(left);
  if (sec <= 3 && sec > 0 && sec !== T.lastSec) { T.lastSec = sec; beep(700, 0.07); }
  tPaint();
}
function tPaint() {
  const el = $("#tmr"); if (!el) return;
  const left = T.run ? (T.end - Date.now()) / 1000 : T.phase === "idle" ? T.p.w : T.left;
  const names = { idle: "Hazır", prep: "Hazırlan", work: "İş", rest: "Dinlen", done: "Bitti" };
  el.className = "tmr " + T.phase;
  $("#tphase").textContent = names[T.phase]; if (T.phase !== "idle") announce(names[T.phase]);
  $("#tbig").textContent = T.phase === "done" ? "✓" : fmtSec(Math.ceil(left));
  $("#trnd").textContent = T.phase === "idle" ? T.p.n + " · " + T.p.k + " tur · " + fmtSec(T.p.w) + " iş" + (T.p.r ? " / " + fmtSec(T.p.r) + " dinlenme" : "") : "Tur " + Math.max(1, T.round) + " / " + T.p.k;
  const b = $("#tgo"); b.textContent = T.run ? "Duraklat" : T.phase === "idle" || T.phase === "done" ? "Başlat" : "Devam";
}

function altToday(k, id) {
  const { c, it } = findItem(k), pi = piOf(c.ph.key), date = state.date, oldX = it.x;
  const nu = window.TK_SWAP_ITEM ? window.TK_SWAP_ITEM(it, id, pi) : Object.assign({}, it, { x: id, n: "" });
  if (!nu) { toast("Bu hareket bugün için uyarlanamadı."); return; }
  const L = logDoc(date, true), hadSwap = L.swap && L.swap[k]; L.swap = Object.assign({}, L.swap, { [k]: nu });

    const L2 = logDoc(date, true); if (hadSwap) L2.swap[k] = hadSwap; else { delete L2.swap[k]; if (!Object.keys(L2.swap).length) delete L2.swap; }
    const moved = Object.keys(L2.items).filter((key) => key.startsWith(k + "~" + oldX)).sort().pop();
    if (moved) { L2.items[k] = L2.items[moved]; delete L2.items[moved]; } else delete L2.items[k];

let DL = null;
// Excel'de =, +, -, @ ile başlayan hücre formül sayılır: başına kesme işareti
function csvCell(x) { let t = String(x == null ? "" : x); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }
function toCSV(rows) { return "\ufeff" + rows.map((r) => r.map(csvCell).join(";")).join("\r\n"); }
// true = dosya kullanıcıya ulaştı (indirildi / paylaşıldı / metin açıldı)
async function saveFile(name, data, type) {
  if (DL) {
    try { await DL.save({ filename: name, data }); toast("İndirildi: " + name); return true; }
    catch (e) { if (!e || e.code !== "declined") toast("İndirilemedi (" + ((e && e.code) || "hata") + ")."); return false; }
  }
  if (window.claude) { textSheet(name, data); return true; } // Claude bağlantısında indirme kapalı: kopyalanabilir metin
  if (window.TK_NATIVE) {
    try { await window.TK_NATIVE_SAVE(name, data); toast("Kaydedildi: " + name); return true; }
    catch (e) { if (/cancel/i.test((e && e.message) || "")) { toast("Vazgeçildi; dosya kaydedilmedi."); return false; } textSheet(name, data); return true; } // paylaşım açılamazsa kopyalanabilir metin
  }
  type = type || "text/plain;charset=utf-8";
  // iPhone ana ekran uygulamasında indirme güvenilmez: paylaşım sayfası (Dosyalar, WhatsApp, iCloud) destekleniyorsa onu kullan
  if (navigator.standalone === true && navigator.share && navigator.canShare) {
    try {
      const f = new File([data], name, { type });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); toast("Kaydedildi: " + name); return true; }
    } catch (e) { if (e && e.name === "AbortError") { toast("Vazgeçildi; dosya kaydedilmedi."); return false; } }
